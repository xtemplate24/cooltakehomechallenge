name: app2-llm-build

on:
  push:
    branches: [main]
    paths:
      - "apps/app2/llm/**"
      - ".github/workflows/app2-llm.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      name: app2-llm
      context: apps/app2/llm
      manifest: app-deployments/app2/llm/deployment.yaml