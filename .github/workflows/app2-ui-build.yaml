name: app2-ui-build

on:
  push:
    branches: [main]
    paths:
      - "apps/app2/ui/**"
      - ".github/workflows/app2-ui.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      name: app2-ui
      context: apps/app2/ui
      manifest: app-deployments/app2/ui/deployment.yaml