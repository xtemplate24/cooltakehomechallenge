name: app3-build

on:
  push:
    branches: [main]
    paths:
      - "apps/app3/**"
      - ".github/workflows/app3.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      name: app3
      context: apps/app3
      manifest: app-deployments/app3/deployment.yaml
