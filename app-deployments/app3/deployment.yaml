apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3
  namespace: app3
spec:
  replicas: 1
  # ReadWriteOnce volume + SQLite = only one pod may use it at a time,
  # so stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app3
          # The build-image pipeline fills in the @sha256 digest after the first push.
          image: ghcr.io/xtemplate24/app3@sha256:8853a1d8b3403cc5adab5d825a0788b65d2d5556ee20b1e62aeb2d2786bc01d6
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_PATH
              value: /data/app3.db
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app3-data
        - emptyDir: {}
          name: tmp
