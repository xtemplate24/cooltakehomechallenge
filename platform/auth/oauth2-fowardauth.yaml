apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-auth
  namespace: auth
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-redirect
  namespace: auth
spec:
  plugin:
    redirectErrors:
      status:
        - "401"
        - "403"
      target: "http://oauth2-proxy.auth.svc.cluster.local:4180/oauth2/sign_in?rd={url}"
      outputStatus: 302